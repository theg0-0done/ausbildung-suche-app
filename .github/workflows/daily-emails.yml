name: Send Daily Emails

on:
  schedule:
    # Runs at 10:00 UTC (11:00 CET/12:00 CEST) every day
    - cron: '0 10 * * *'
  # Allow manual trigger from the GitHub Actions UI
  workflow_dispatch:

jobs:
  send-emails:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./server
        
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run daily email job
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ env.RESEND_FROM_EMAIL || 'onboarding@resend.dev' }}
          APP_BASE_URL: ${{ env.APP_BASE_URL || 'https://ausbildung-suche-app.vercel.app' }}
        run: npm run send-emails
